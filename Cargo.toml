[package]
name = "geocode-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
mcp-core = { git = "https://github.com/adelie-ai/mcp-core" }
clap = { version = "4.5.54", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
# Structured diagnostics: debug! on outbound Photon requests, and
# #[instrument] on the tool handlers. Already in the tree through mcp-core's
# adelie-telemetry dependency, so naming it directly adds no crate.
tracing = "0.1.44"

[dev-dependencies]
httpmock = "0.7"
# A capturing layer for the telemetry acceptance tests: they read back the
# spans and events the dispatch path really produced. Already in the tree
# through mcp-core's adelie-telemetry dependency, so this adds no crate.
tracing-subscriber = "0.3.23"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
